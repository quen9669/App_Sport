# App Sport on the VPS, as one Coolify project ("app-sport").
#
# Two containers on a Docker network of their own, one volume, and NO port
# published on the VPS: you reach the app only through Tailscale, at
# https://app-sport.<your-tailnet>.ts.net. Nothing here touches other projects.
# Guide: docs/learning/07-vps-coolify.md
#
# Secrets (${...}) live in the OpenBao vault (apps/app-sport/<NAME>); the vault
# sync pushes them into Coolify. Never typed here, never in a real .env.

services:
  # The app: API + interface on port 8000, inside the project network only.
  sport-app:
    build:
      context: .
      # Read-only GitHub token for the shared library (vault: apps/app-sport/NPM_TOKEN).
      # Used only by the build stage that compiles the interface, never at runtime.
      args:
        NPM_TOKEN: ${NPM_TOKEN:-}
    restart: unless-stopped
    environment:
      # Same values as the PC's .env. TOKEN_ENCRYPTION_KEY MUST be the PC's one:
      # the Strava tokens stored in the database are encrypted with it.
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:?}
      APP_PASSWORD_HASH: ${APP_PASSWORD_HASH:?}
      FRONTEND_URL: ${FRONTEND_URL:?}
      STRAVA_REDIRECT_URI: ${STRAVA_REDIRECT_URI:-}
      STRAVA_CLIENT_ID: ${STRAVA_CLIENT_ID:-}
      STRAVA_CLIENT_SECRET: ${STRAVA_CLIENT_SECRET:-}
      GARMIN_EMAIL: ${GARMIN_EMAIL:-}
      GARMIN_PASSWORD: ${GARMIN_PASSWORD:-}
      # AI coaches: only through OmniRoute (référentiel R-05, SPT-01), on llm-net.
      # The monthly quota is set in OmniRoute, never in the app (R-07, SPT-02).
      OMNIROUTE_API_KEY: ${OMNIROUTE_API_KEY}
      OMNIROUTE_BASE_URL: http://omniroute:20128/v1
      # Model names sent to OmniRoute; empty = "auto" (OmniRoute routes). From the vault.
      COACH_MODEL: ${COACH_MODEL:-}
      COACH_LIGHT_MODEL: ${COACH_LIGHT_MODEL:-}
      # Address of the Grafana dashboard (button on Réglages > Monitoring); empty = no button.
      GRAFANA_URL: ${GRAFANA_URL:-}
      # Pinged after each scheduled sync (référentiel R-26); the URL comes from the vault.
      HEALTHCHECKS_URL: ${HEALTHCHECKS_URL:-}
      APP_TIMEZONE: Europe/Luxembourg
    volumes:
      - app-sport-data:/data
    # default: the project's own network (the Tailscale sidecar reaches the app
    # there); llm-net: the shared network where OmniRoute listens; obs-net: the
    # supervision reads http://sport-app:8000/health from there (SPT-06).
    networks: [default, llm-net, obs-net]
    # No backup container (référentiel R-11, SPT-09): the server's nightly archive
    # copies the named volume app-sport-data, 7 days on Google Drive.
    # Hardening: read-only system, no Linux privileges, a memory ceiling.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m

  # Door to the tailnet: a Tailscale device of its own, HTTPS, no published port.
  # Userspace networking: no /dev/net/tun, no NET_ADMIN, nothing on the host.
  sport-tailscale:
    build: ./deploy/tailscale
    restart: unless-stopped
    hostname: app-sport
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?}
      TS_HOSTNAME: app-sport
      TS_USERSPACE: "true"
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      # Log in with the key only the first time; afterwards the saved state is used.
      TS_AUTH_ONCE: "true"
      # No logs sent to Tailscale's servers (the project allows no telemetry).
      TS_TAILSCALED_EXTRA_ARGS: --no-logs-no-support
    volumes:
      - app-sport-tailscale:/var/lib/tailscale
    depends_on: [sport-app]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m

volumes:
  app-sport-data:
  app-sport-tailscale:

networks:
  # Created once on the server by the AI socle, shared by the apps that use AI.
  llm-net:
    external: true
  # Created by the supervision socle; the blackbox probes /health through it.
  obs-net:
    external: true
