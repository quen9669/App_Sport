# Dependabot opens a pull request when a library the app uses has a new version,
# grouped once a week (security fixes come as soon as they are published).
# CI runs on each of these PRs: merge it when it is green.
version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
