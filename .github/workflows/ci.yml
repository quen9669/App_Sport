# Continuous integration: GitHub runs these checks on every pull request and on
# every push to main. A green check mark on the PR means everything passed.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel an older run of the same branch when a new commit is pushed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy app tests scripts evals
      - name: Tests
        run: uv run pytest

  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build

  security:
    name: Security (vulnerable dependencies, secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the whole history: a key committed then removed still counts
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # Known vulnerabilities in the Python libraries the app runs with (locked versions).
      - name: Audit Python dependencies
        working-directory: backend
        run: |
          uv export --locked --no-dev --format requirements-txt > "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit --disable-pip -r "$RUNNER_TEMP/requirements.txt"
      # Same for the interface's libraries (only serious ones block the PR).
      - name: Audit npm dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
      # A key, token or password committed by mistake blocks the PR.
      - name: Look for secrets
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz \
            | tar xz -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git . --no-banner --redact

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: |
          cd backend && uv sync --locked
          cd ../frontend && npm ci
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run end-to-end tests
        working-directory: frontend
        run: npm run test:e2e
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
